<h1>Документи по ОЗ</h1>
<p style="MARGIN-LEFT: 0px">У журналі зберігається список всіх документів обліку основних засобів. <br>Журнал дозволяє виконувати всі операції, пов'язані з основними засобами: <a href="Document.ПринятиеКУчетуОС/Help">приймати до обліку</a>, фіксувати <a href="Document.РегистрацияНаработок/Help">напрацювання</a>, проводити <a href="Document.СписаниеОС/Help">списання</a>, <a href="Document.ИзменениеПараметровОС/Help">змінювати параметри обліку</a>. <br></p>
