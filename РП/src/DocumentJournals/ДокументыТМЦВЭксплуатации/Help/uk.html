<h1>Документи ТМЦ в експлуатації</h1>
<p style="MARGIN-LEFT: 0px">У журналі зберігається список всіх документів обліку спецодягу, спецоснастки, інвентарю та іншого господарського приладдя. <br>Журнал дозволяє виконувати всі операції, пов'язані з урахуванням ТМЦ в експлуатації: <a href="Document.ВнутреннееПотреблениеТоваров/Help">передавати</a>, <a href="Document.ПеремещениеВЭксплуатации/Help">переміщати в експлуатацію</a>, <a href="Document.СписаниеИзЭксплуатации/Help">проводити списання</a><br><br><br><br></p>
