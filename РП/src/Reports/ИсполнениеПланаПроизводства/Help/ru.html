<h1>Исполнение плана производства</h1>
<p style="MARGIN-LEFT: 0px">Отчет предназначен для контроля выполнения плана производства продукции.<br>Отчет позволяет оценить фактическое состояние производства продукции по плану<no_utka> и созданные заказы на производство, которые еще не поступили на склад</no_utka>. </p>
