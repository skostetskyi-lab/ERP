<h1>Оборотна відомість бюджетування</h1>
<p style="MARGIN-LEFT: 0px">Звіт призначений для план-фактного аналізу за <b><a href="Catalog.СтатьиБюджетов/Help">Статтями бюджетів</a></b> та їх аналітикам. <br><br>Особливості звіту:</p>
<ul style="MARGIN-LEFT: 20px"><li>Звіт формується за плановими / фактичними сценаріями. </li><li>Передбачена розшифровка сум, наприклад, до реєстратора.</li></ul><p> </p></body></html>
