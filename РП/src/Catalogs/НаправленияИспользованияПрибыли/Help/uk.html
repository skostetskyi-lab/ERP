<h1>Довідник "Напрямки використання прибутку" </h1>
<p>
</p><p class="Usual">Довідник призначений для ведення аналітичного обліку розподілу та використання прибутку за напрямками. Такий облік прибутку ведеться в частині нерозподіленого прибутку в обігу та використаного прибутку.</p></body></html>
